name: Release

on:
  push:
    tags:
      - "v*.*.*"

# The release workflow is triggered only by a version tag.
# CI is called as a reusable workflow and must succeed before publish can run.
permissions:
  contents: read

jobs:
  ci:
    name: CI release gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Attest and publish FAP
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged K2S source
        uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download CI-built FAP
        uses: actions/download-artifact@v6
        with:
          name: k2s-credential-reader-fap
          path: dist

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail

          FAP_SOURCE="dist/k2s_credential_reader.fap"
          FAP_RELEASE="dist/k2s_credential_reader-${GITHUB_REF_NAME}.fap"

          test -f "$FAP_SOURCE"
          mv "$FAP_SOURCE" "$FAP_RELEASE"

          (
            cd dist
            sha256sum "k2s_credential_reader-${GITHUB_REF_NAME}.fap" \
              > "k2s_credential_reader-${GITHUB_REF_NAME}.fap.sha256"
          )

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/k2s_credential_reader-${{ github.ref_name }}.fap

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/k2s_credential_reader-${{ github.ref_name }}.fap
            dist/k2s_credential_reader-${{ github.ref_name }}.fap.sha256
